        font-size="34" font-weight="700"
        fill="#4B5947" letter-spacing="2">همم</text>
  <!-- English sub-text -->
  <text x="100" y="185" text-anchor="middle"
        font-family="Cairo, Arial, sans-serif"
        font-size="15" font-weight="600"
        fill="#F28705" letter-spacing="3">Hamem</text>
</svg>
