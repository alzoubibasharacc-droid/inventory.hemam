services:
  - type: web
    name: inventory-app
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python migrate.py && gunicorn --bind "0.0.0.0:$PORT" --workers 2 --timeout 120 "app:create_app()"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString

databases:
  - name: inventory-db
    plan: free
    databaseName: inventory
    user: inventory
